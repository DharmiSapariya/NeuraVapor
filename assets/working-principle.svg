<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="NeuraVapor working principle: closed-loop water circuit through a membrane distillation chamber" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8a50"/>
    </marker>
    <style>
      .flow   { stroke-dasharray: 7 7; animation: dash 1.2s linear infinite; fill: none; stroke-width: 3; }
      .cold   { stroke: #4fc3f7; }
      .hot    { stroke: #ff8a50; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
      .node   { fill: #13293d; stroke: #2f5675; stroke-width: 1.5; }
      .t1     { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e3f1fb; text-anchor: middle; }
      .t2     { font: 11px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8fb5cf; text-anchor: middle; }
      .cap    { font: 11px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8fb5cf; }
    </style>
  </defs>

  <rect width="900" height="340" rx="10" fill="#0d1b2a"/>

  <!-- loop label -->
  <text x="450" y="24" class="cap" text-anchor="middle">Recirculation return (sealed loop, no external inlet or outlet)</text>

  <!-- pipes -->
  <path class="flow cold" d="M150,115 H370" marker-end="url(#ah)"/>
  <path class="flow hot"  d="M490,115 H550" marker-end="url(#ao)"/>
  <path class="flow hot"  d="M550,115 H710"/>
  <path class="flow cold" d="M710,115 H800 V38 H90 V75" marker-end="url(#ah)"/>

  <!-- moving water parcels along the loop -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle r="3.5"><animateMotion dur="9s" begin="0s"    repeatCount="indefinite" path="M150,115 H800 V38 H90 V75"/></circle>
    <circle r="3.5"><animateMotion dur="9s" begin="-3s"   repeatCount="indefinite" path="M150,115 H800 V38 H90 V75"/></circle>
    <circle r="3.5"><animateMotion dur="9s" begin="-6s"   repeatCount="indefinite" path="M150,115 H800 V38 H90 V75"/></circle>
  </g>

  <!-- nodes -->
  <rect class="node" x="30"  y="75" width="120" height="80" rx="8"/>
  <text class="t1" x="90"  y="111">Reservoir</text>
  <text class="t2" x="90"  y="130">loop water supply</text>

  <rect class="node" x="210" y="85" width="100" height="60" rx="8"/>
  <text class="t1" x="260" y="111">Pump</text>
  <text class="t2" x="260" y="128">12 V DC, PWM</text>

  <rect class="node" x="370" y="85" width="120" height="60" rx="8" style="stroke:#ff8a50"/>
  <text class="t1" x="430" y="111">Water block</text>
  <text class="t2" x="430" y="128">resistor-heated</text>

  <!-- MD chamber -->
  <rect x="550" y="80"  width="160" height="70" fill="#2b2320" stroke="#ff8a50" stroke-width="1.5"/>
  <rect x="550" y="150" width="160" height="70" fill="#112d42" stroke="#4fc3f7" stroke-width="1.5"/>
  <text class="t1" x="630" y="106" style="fill:#ffd2bd">Hot channel</text>
  <text class="t1" x="630" y="206" style="fill:#bfe6fa">Cold channel</text>
  <line x1="550" y1="150" x2="710" y2="150" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="710" y1="150" x2="716" y2="150" stroke="#8fb5cf"/>
  <text class="cap" x="720" y="154">PTFE membrane</text>
  <text class="cap" x="550" y="72">Membrane distillation chamber</text>

  <!-- vapor crossing membrane -->
  <g fill="#e1f5fe">
    <circle cx="575" r="3"><animate attributeName="cy" values="132;172" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="605" r="3"><animate attributeName="cy" values="132;172" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="655" r="3"><animate attributeName="cy" values="132;172" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
    <circle cx="685" r="3"><animate attributeName="cy" values="132;172" dur="2.4s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-0.4s" repeatCount="indefinite"/></circle>
  </g>
  <text class="cap" x="450" y="176" text-anchor="end" style="fill:#bfe6fa">vapor crosses, liquid cannot</text>
  <line x1="454" y1="172" x2="548" y2="160" stroke="#3d6a8a" stroke-width="1"/>

  <!-- Peltier -->
  <line x1="630" y1="220" x2="630" y2="240" stroke="#4fc3f7" stroke-width="2"/>
  <rect class="node" x="550" y="240" width="160" height="44" rx="6" style="stroke:#4fc3f7"/>
  <text class="t1" x="630" y="259">Peltier TEC1-12706</text>
  <text class="t2" x="630" y="275">cold plate, condenses vapor</text>

  <!-- distillate -->
  <path class="flow cold" d="M710,190 H756" marker-end="url(#ah)"/>
  <rect class="node" x="760" y="170" width="120" height="60" rx="8" style="stroke:#4fc3f7"/>
  <text class="t1" x="820" y="196">Distillate</text>
  <text class="t2" x="820" y="213">recovered water</text>
  <circle cx="820" r="3" fill="#4fc3f7"><animate attributeName="cy" values="232;250" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle>

  <!-- caption -->
  <text class="cap" x="30" y="322">Heat enters at the water block, vapor migrates across the hydrophobic membrane, and condensate leaves the loop as distilled water.</text>
</svg>
