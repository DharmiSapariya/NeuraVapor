<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="NeuraVapor banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a2a"/>
      <stop offset="1" stop-color="#0f3a52"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81d4fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#81d4fa" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- rising vapor -->
  <g fill="#b3e5fc">
    <circle cx="820" r="4"><animate attributeName="cy" values="235;20" dur="6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="900" r="6"><animate attributeName="cy" values="235;20" dur="7.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="7.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="980" r="3"><animate attributeName="cy" values="235;20" dur="5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="1060" r="5"><animate attributeName="cy" values="235;20" dur="6.5s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="6.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" r="4"><animate attributeName="cy" values="235;20" dur="8s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="740" r="3"><animate attributeName="cy" values="235;20" dur="7s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="-5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- waves -->
  <path fill="url(#w2)" d="M0,232 q75,-22 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 V280 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-300 0" to="0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#w1)" d="M0,240 q75,-18 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 V280 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="118" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="1">NeuraVapor</text>
    <text x="82" y="160" font-size="22" fill="#9cc9e3">Closed-loop waste-heat-to-water recovery for data centers</text>
    <text x="82" y="194" font-size="15" fill="#6fa8c7" letter-spacing="2">MEMBRANE DISTILLATION   |   NOISE-ADAPTIVE COOLING   |   LIVE 3D DIGITAL TWIN</text>
  </g>
</svg>
